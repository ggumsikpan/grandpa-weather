<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>큰글씨 날씨·지도</title>
<meta name="description" content="광고 없는 큰글씨 날씨와 지도">
<meta name="theme-color" content="#1e5bd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="날씨지도">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 날씨 화면 ============ -->
<main id="view-weather" class="view active" aria-label="날씨">
  <div id="warn" class="warn" role="alert" hidden></div>

  <div id="today" class="today-date">&nbsp;</div>
  <h1 id="place" class="place">&nbsp;</h1>

  <section class="now" aria-live="polite">
    <div id="nowIcon" class="now-icon">⏳</div>
    <div class="now-right">
      <div id="nowTemp" class="now-temp">--°</div>
      <div id="nowDesc" class="now-desc">불러오는 중</div>
    </div>
  </section>

  <!-- 오늘 시간별 (첫 화면) -->
  <section id="hours" class="hours" aria-label="시간별 날씨"></section>

  <section class="rows">
    <div class="row"><span class="r-label">오늘</span><span class="r-val"><span id="tMin" class="cold">--°</span> ~ <span id="tMax" class="hot">--°</span></span></div>
    <div class="row"><span class="r-label">우산</span><span id="umbrella" class="r-val">--</span></div>
    <div class="row"><span class="r-label">미세먼지</span><span id="dust" class="r-val">--</span></div>
  </section>

  <div id="advice" class="advice">&nbsp;</div>

  <section class="tomorrow">
    <div class="tm-top"><span class="r-label">내일</span><span id="tmIcon" class="tm-icon"></span><span id="tmText" class="tm-text">--</span></div>
    <div id="tmSub" class="tm-sub">&nbsp;</div>
  </section>

  <button id="btnSpeak" class="btn primary wide speak">🔊 소리로 듣기</button>

  <!-- 여기부터는 아래로 내려야 보임 -->
  <button id="btnMore" class="btn outline wide more" aria-expanded="false">이번 주 날씨 더 보기 ▼</button>
  <div id="moreBox" hidden>
    <h2>이번 주 날씨</h2>
    <ul id="days" class="list"></ul>
  </div>

  <div class="updated-row">
    <span id="updated" class="updated"></span>
    <button id="btnRefresh" class="btn outline small">🔄 새로 확인</button>
  </div>

  <button id="btnGuardian" class="guardian-link">⚙ 설정</button>
</main>

<!-- ============ 지도 화면 ============ -->
<main id="view-map" class="view" aria-label="지도">
  <div id="map"></div>
  <button id="btnMapSearch" class="map-searchbar">🔎 장소 찾기</button>
  <div class="map-ctrl">
    <button id="zIn" aria-label="크게 보기">＋</button>
    <button id="zOut" aria-label="작게 보기">－</button>
    <button id="mapMe" aria-label="내 위치로" class="me">📍</button>
  </div>
</main>

<!-- ============ 설정 ============ -->
<div id="settings" class="overlay" hidden role="dialog" aria-label="설정">
  <div class="ov-head">
    <h2>설정</h2>
  </div>

  <h3>날씨 볼 동네</h3>
  <div id="setPlace" class="set-value">--</div>
  <button id="btnChangeHome" class="btn outline wide">🔎 동네 바꾸기</button>
  <button id="btnResetHome" class="btn outline wide">처음 동네(인천 미추홀구)로 되돌리기</button>

  <h3>미세먼지 측정소</h3>
  <p class="set-note">에어코리아 측정소 이름입니다. 비워두면 가까운 지역 예측값을 씁니다.</p>
  <form id="stationForm" class="search-form">
    <input id="stationInput" type="text" autocomplete="off" placeholder="예: 숭의">
    <button class="btn primary" type="submit">저장</button>
  </form>

  <h3>글씨 크기</h3>
  <div class="size-choices">
    <button class="btn outline size" data-size="0">보통</button>
    <button class="btn outline size" data-size="1">크게</button>
    <button class="btn outline size" data-size="2">아주 크게</button>
  </div>

  <button id="btnInstall" class="btn outline wide" hidden>📲 바탕화면에 설치</button>

  <h3>날씨 자료</h3>
  <div id="setSource" class="set-value">--</div>

  <button id="settingsClose" class="btn primary wide close-big">닫기</button>
</div>

<!-- ============ 검색 창 ============ -->
<div id="search" class="overlay" hidden role="dialog" aria-label="장소 찾기">
  <div class="ov-head">
    <h2 id="searchTitle">장소 찾기</h2>
    <button id="searchClose" class="btn outline small">닫기 ✕</button>
  </div>
  <form id="searchForm" class="search-form">
    <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" placeholder="예: 주안역, 인하대병원">
    <button class="btn primary" type="submit">찾기</button>
  </form>
  <p id="searchHint" class="search-hint">이름을 쓰고 <b>찾기</b>를 누르세요.</p>
  <ul id="searchResults" class="list results"></ul>
</div>

<!-- ============ 아래 탭 ============ -->
<nav class="tabbar">
  <button id="tabWeather" class="tab active" aria-label="날씨 보기"><span>☀️</span>날씨</button>
  <button id="tabMap" class="tab" aria-label="지도 보기"><span>🗺️</span>지도</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
